name: Backend CI Pipeline

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [ develop, main ]
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-scan:
    name: Linting & Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno Runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint Edge Functions
        run: |
          cd supabase/functions
          deno lint
          deno check **/*.ts

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database-validation:
    name: Database Migrations & Integration Testing
    runs-on: ubuntu-latest
    needs: lint-and-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Deno Runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Ephemeral Supabase Container
        run: |
          supabase start -x realtime,storage-api,imgproxy

      - name: Apply Migrations & Verify Idempotency
        run: |
          supabase db reset

      - name: Verify Migration Files Syntax & Linter
        run: |
          supabase db lint --schema public --level error

      - name: Execute End-to-End Test Suite (Phases 1 through 7)
        run: |
          STATUS_ENV=$(supabase status -o env)
          export SUPABASE_URL=$(echo "$STATUS_ENV" | grep '^API_URL=' | cut -d= -f2 | tr -d '"')
          export SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS_ENV" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2 | tr -d '"')
          export SUPABASE_ANON_KEY=$(echo "$STATUS_ENV" | grep '^ANON_KEY=' | cut -d= -f2 | tr -d '"')
          node scripts/test_phase1.mjs
          node scripts/test_phase2.mjs
          node scripts/test_phase3.mjs
          node scripts/test_google_maps_and_postgis.mjs
          node scripts/test_phase3_concurrency.mjs
          node scripts/test_backend_phase4.mjs
          node scripts/test_backend_phase5.mjs
          node scripts/test_backend_phase6.mjs
          node scripts/test_backend_phase7.mjs

      - name: Stop Local Supabase
        if: always()
        run: supabase stop

