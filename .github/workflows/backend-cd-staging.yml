name: Deploy Backend to Staging

on:
  push:
    branches: [ develop ]
    paths:
      - 'supabase/**'
      - '.github/workflows/backend-cd-staging.yml'

jobs:
  deploy-staging:
    name: Deploy to Staging Supabase
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Staging Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

      - name: Push Database Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase db push

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy payment-webhook --no-verify-jwt
          if [ -d "supabase/functions/maps-proxy" ]; then
            supabase functions deploy maps-proxy
          fi
          if [ -d "supabase/functions/notifications-dispatcher" ]; then
            supabase functions deploy notifications-dispatcher
          fi

      - name: Sync Staging Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set \
            GOOGLE_MAPS_API_KEY="${{ secrets.STAGING_GOOGLE_MAPS_API_KEY }}" \
            FLUTTERWAVE_SECRET_KEY="${{ secrets.STAGING_FLW_SECRET_KEY }}" \
            FLUTTERWAVE_WEBHOOK_HASH="${{ secrets.STAGING_FLW_WEBHOOK_HASH }}" \
            AFRICASTALKING_API_KEY="${{ secrets.STAGING_AT_API_KEY }}" \
            AFRICASTALKING_USERNAME="${{ secrets.STAGING_AT_USERNAME }}" \
            SMS_SENDER_ID="WALATEST"

      - name: Run Smoke Verification Tests
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          node scripts/test_phase5.mjs
